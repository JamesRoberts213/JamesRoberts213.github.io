<!-- Featured Projects Section -->
<main id="projects">
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 4rem 0 2rem;">
        <h2 class="section-title" style="margin: 0;">Featured Projects</h2>
        <a href="projects.html" class="cta-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">View All Projects &rarr;</a>
    </div>

    <!-- Container for the 3 dynamic tiles -->
    <div class="grid" id="featured-grid"></div>
</main>

<script>
// Array containing all of your projects
const allProjects = [
    {
        title: "Embedded Hardware Module",
        desc: "Compact display system built with a microcontroller, custom sensors, and integrated power management.",
        tags: ["C++", "Hardware", "Prototyping"],
        link: "projects.html#embedded-hardware"
    },
    {
        title: "Numerical Advection Solver",
        desc: "Finite difference scheme implementations analyzing stability bounds and amplification factors.",
        tags: ["Python", "CFD", "Numerical Methods"],
        link: "cagd-solver.html"
    },
    {
        title: "Signal Processing System",
        desc: "Filter design and algorithmic architecture exploring adaptive LMS noise control techniques.",
        tags: ["MATLAB", "DSP", "Control Systems"],
        link: "projects.html#signal-processing"
    },
    {
        title: "Structural Strain Analysis",
        desc: "Half-bridge strain gauge calibration and bending force measurement on structural steel.",
        tags: ["Sensors", "Data Acquisition", "Structures"],
        link: "projects.html#strain-analysis"
    },
    {
        title: "Flow-Forming Defect Diagnostics",
        desc: "Investigation into cracking mechanisms and material stress bounds during cylindrical pass forming.",
        tags: ["Materials", "Failure Analysis", "Aerospace"],
        link: "projects.html#flow-forming"
    }
];

function renderFeaturedProjects() {
    const grid = document.getElementById('featured-grid');
    grid.innerHTML = '';

    // Pick 3 random distinct projects from the list
    const shuffled = [...allProjects].sort(() => 0.5 - Math.random());
    const selected = shuffled.slice(0, 3);

    selected.forEach(project => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.cursor = 'pointer';
        card.onclick = () => window.location.href = project.link;

        const tagsHTML = project.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

        card.innerHTML = `
            <h3>${project.title}</h3>
            <p>${project.desc}</p>
            <div class="tags">${tagsHTML}</div>
            <div class="card-links" style="margin-top: 1.25rem;">
                <span style="color: var(--accent); font-size: 0.85rem; font-weight: 600;">View Details &rarr;</span>
            </div>
        `;
        grid.appendChild(card);
    });
}

// Initial render
renderFeaturedProjects();

// Optional: Automatically swap tiles every 10 seconds
setInterval(renderFeaturedProjects, 10000);
</script>
